# Deploy to Fly.io (#99). Does nothing until the repo secret FLY_API_TOKEN exists
# (Settings -> Secrets and variables -> Actions). The app, volume and token are created by the
# Fly account owner; see #99 for the one-time setup.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Skip when Fly is not set up yet
        if: env.FLY_API_TOKEN == ''
        run: echo "FLY_API_TOKEN is not set; skipping the deploy (see issue 99)."
      - uses: actions/checkout@v4
        if: env.FLY_API_TOKEN != ''
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: env.FLY_API_TOKEN != ''
      - name: Deploy
        if: env.FLY_API_TOKEN != ''
        run: flyctl deploy --remote-only
      - name: Check /healthz
        if: env.FLY_API_TOKEN != ''
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "https://$(grep -m1 '^app' fly.toml | cut -d"'" -f2).fly.dev/healthz"; then exit 0; fi
            sleep 6
          done
          echo "healthz did not answer" && exit 1
