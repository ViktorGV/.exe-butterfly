<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#5ec8ff" />
    <title>Flutter.exe</title>
    <link rel="stylesheet" href="/src/styles/base.css" />
    <style>
      /* Touch controls sit between the canvas and the UI layer; only their own parts take input. */
      #touch-root {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 5;
      }
    </style>
  </head>
  <body>
    <canvas id="game" aria-label="Wobble Rush 3D"></canvas>
    <div id="touch-root"></div>
    <div id="ui-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
