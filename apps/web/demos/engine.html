<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Engine demo · Wobble Rush 3D</title>
    <style>
      :root {
        --panel: rgb(255 255 255 / 0.88);
        --ink: #1d1b2f;
        --accent: #ff6bd5;
        --muted: #5b5674;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        font:
          14px/1.4 system-ui,
          'Segoe UI',
          Roboto,
          sans-serif;
        color: var(--ink);
        background: #bfe9ff;
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .panel {
        position: fixed;
        right: calc(12px + env(safe-area-inset-right, 0px));
        bottom: calc(12px + env(safe-area-inset-bottom, 0px));
        max-width: min(340px, calc(100vw - 24px));
        display: grid;
        gap: 10px;
        padding: 12px 14px;
        background: var(--panel);
        border-radius: 14px;
        box-shadow: 0 8px 24px rgb(0 0 0 / 0.15);
      }
      .panel h1 {
        margin: 0;
        font-size: 15px;
      }
      .panel p {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      .row > span {
        min-width: 58px;
        font-weight: 600;
        font-size: 12px;
      }
      button {
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        padding: 5px 10px;
        border: 2px solid var(--ink);
        border-radius: 999px;
        background: #fff;
        color: var(--ink);
        cursor: pointer;
      }
      button[aria-pressed='true'] {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }
      button:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
      kbd {
        font:
          11px ui-monospace,
          monospace;
        padding: 1px 4px;
        border: 1px solid var(--muted);
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <canvas id="game" aria-label="Engine test scene"></canvas>
    <div class="panel">
      <h1>Engine core (#3)</h1>
      <p>
        Press <kbd>`</kbd> to toggle the debug overlay. The ring spins on the fixed 60 Hz step; the ball is drawn
        between steps using alpha.
      </p>
      <div class="row">
        <span>Objects</span>
        <button type="button" id="stress">Add 400 objects</button>
        <button type="button" id="clear">Clear</button>
      </div>
      <div class="row">
        <span>Engine</span>
        <button type="button" id="pause" aria-pressed="false">Pause</button>
        <button type="button" id="recreate">Dispose and recreate</button>
      </div>
    </div>
    <script type="module" src="./engine.ts"></script>
  </body>
</html>
