<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Theme v2 demo · Wobble Rush 3D</title>
    <style>
      :root {
        --panel: rgb(255 255 255 / 0.9);
        --ink: #1d1b2f;
        --muted: #5b5674;
        --hud-accent: #ff6bd5;
        --hud-font: system-ui, sans-serif;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        font:
          13px/1.4 system-ui,
          'Segoe UI',
          Roboto,
          sans-serif;
        color: var(--ink);
        background: #222;
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .panel {
        position: fixed;
        right: 12px;
        top: 12px;
        width: min(330px, calc(100vw - 24px));
        max-height: calc(100vh - 24px);
        overflow: auto;
        display: grid;
        gap: 8px;
        padding: 12px 14px;
        background: var(--panel);
        border-radius: 14px;
        box-shadow: 0 8px 24px rgb(0 0 0 / 0.2);
      }
      .panel h1 {
        margin: 0;
        font-size: 15px;
      }
      .title {
        font-family: var(--hud-font);
        color: var(--hud-accent);
        font-size: 18px;
        font-weight: 800;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        align-items: center;
      }
      .row > span {
        min-width: 58px;
        font-weight: 600;
        font-size: 12px;
      }
      button {
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        padding: 4px 9px;
        border: 2px solid var(--ink);
        border-radius: 999px;
        background: #fff;
        color: var(--ink);
        cursor: pointer;
      }
      button[aria-pressed='true'] {
        background: var(--hud-accent);
        color: #fff;
        border-color: var(--hud-accent);
      }
      pre {
        margin: 0;
        font:
          11px/1.45 ui-monospace,
          monospace;
        color: var(--muted);
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <canvas id="game" aria-label="Theme v2 test course"></canvas>
    <div class="panel">
      <h1>Theme renderer v2 (#64)</h1>
      <div class="title" id="title"></div>
      <div class="row" role="group" aria-label="Theme" id="themes"><span>Theme</span></div>
      <div class="row" role="group" aria-label="Features" id="features"><span>Features</span></div>
      <div class="row" role="group" aria-label="Ground" id="grounds"><span>Ground</span></div>
      <div class="row" role="group" aria-label="Particles" id="particles"><span>Particles</span></div>
      <div class="row">
        <span>Tests</span>
        <button type="button" id="swap50">Swap 50×</button>
        <button type="button" id="noimg" aria-pressed="false">No images</button>
        <button type="button" id="wire" aria-pressed="false">Colliders</button>
      </div>
      <pre id="stats"></pre>
    </div>
    <script type="module" src="./theme-v2.ts"></script>
  </body>
</html>
