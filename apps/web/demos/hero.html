<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Hero bridge demo · Wobble Rush 3D</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #bfe9ff;
        font:
          14px/1.4 system-ui,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .panel {
        position: fixed;
        right: calc(12px + env(safe-area-inset-right, 0px));
        bottom: calc(12px + env(safe-area-inset-bottom, 0px));
        max-width: min(320px, calc(100vw - 24px));
        padding: 12px 14px;
        background: rgb(255 255 255 / 0.88);
        color: #1d1b2f;
        border-radius: 14px;
        box-shadow: 0 8px 24px rgb(0 0 0 / 0.15);
        display: grid;
        gap: 8px;
      }
      .panel h1 {
        margin: 0;
        font-size: 15px;
      }
      .panel p {
        margin: 0;
        font-size: 12px;
        color: #5b5674;
      }
      button {
        font: inherit;
        font-weight: 600;
        padding: 6px 12px;
        border: 2px solid #1d1b2f;
        border-radius: 999px;
        background: #fff;
        color: #1d1b2f;
        cursor: pointer;
        justify-self: start;
      }
    </style>
  </head>
  <body>
    <canvas id="game" aria-label="Hero bridge test scene"></canvas>
    <div class="panel">
      <h1>Hero's bridge (#84)</h1>
      <p>
        Players who saved others and never pushed get this bridge across the snow-blower field. The wind does not push
        them while they are on it. Others never see it.
      </p>
      <button type="button" id="open">Open the bridge</button>
    </div>
    <script type="module" src="./hero.ts"></script>
  </body>
</html>
