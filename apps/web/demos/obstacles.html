<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Obstacles demo · Wobble Rush 3D</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #bfe9ff;
        font:
          14px/1.4 system-ui,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .panel {
        position: fixed;
        left: calc(12px + env(safe-area-inset-left, 0px));
        top: calc(12px + env(safe-area-inset-top, 0px));
        max-width: min(330px, calc(100vw - 24px));
        padding: 10px 14px;
        background: rgb(255 255 255 / 0.88);
        color: #1d1b2f;
        border-radius: 14px;
        box-shadow: 0 8px 24px rgb(0 0 0 / 0.15);
      }
      .panel h1 {
        margin: 0 0 4px;
        font-size: 15px;
      }
      .panel p {
        margin: 0;
        font-size: 12px;
        color: #5b5674;
      }
    </style>
  </head>
  <body>
    <canvas id="game" aria-label="Obstacle test scene"></canvas>
    <div class="panel">
      <h1>Course components</h1>
      <p>
        Front: arrow tiles (green dashes you forward, red throws you back). Middle: a wall whose panels slide up and
        down. Back: two carousels with four pads to hop on.
      </p>
    </div>
    <script type="module" src="./obstacles.ts"></script>
  </body>
</html>
