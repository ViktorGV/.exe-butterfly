<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Character demo · Wobble Rush 3D</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        font:
          14px/1.4 system-ui,
          'Segoe UI',
          Roboto,
          sans-serif;
        color: #1d1b2f;
        background: #bfe9ff;
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #panel {
        position: fixed;
        top: 12px;
        left: 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        max-width: calc(100% - 24px);
      }
      #panel button {
        border: 0;
        border-radius: 999px;
        padding: 8px 14px;
        font: inherit;
        background: rgb(255 255 255 / 0.88);
        cursor: pointer;
      }
      #panel button[aria-pressed='true'] {
        background: #ff6bd5;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="panel" role="toolbar" aria-label="Animation"></div>
    <script type="module" src="./character.ts"></script>
  </body>
</html>
