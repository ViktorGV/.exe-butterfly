<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Chain Reaction Desk · Wobble Rush 3D</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        font:
          14px/1.4 system-ui,
          'Segoe UI',
          Roboto,
          sans-serif;
        color: #2a2430;
        background: #f3d9b8;
      }
      #stage {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .bar {
        position: fixed;
        left: 12px;
        right: 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      #top {
        top: 12px;
      }
      #segments {
        bottom: 12px;
      }
      button {
        border: 0;
        border-radius: 999px;
        padding: 7px 13px;
        font: inherit;
        background: rgb(255 255 255 / 0.88);
        cursor: pointer;
      }
      button[aria-pressed='true'] {
        background: #2a2430;
        color: #fff;
      }
      #segments button[aria-pressed='true'] {
        background: #ff7b6b;
      }
      #title {
        position: fixed;
        top: 56px;
        left: 14px;
        pointer-events: none;
      }
      #title b {
        display: block;
        font-size: 20px;
      }
      #status {
        position: fixed;
        right: 14px;
        top: 60px;
        font-size: 12px;
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="top" class="bar" role="toolbar" aria-label="Course and camera"></div>
    <div id="title"></div>
    <div id="status"></div>
    <div id="segments" class="bar" role="toolbar" aria-label="Sections"></div>
    <script type="module" src="./desk-course.ts"></script>
  </body>
</html>
