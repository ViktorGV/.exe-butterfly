# fly.toml app configuration file generated for amusnetexe on 2026-11-28T01:49:55Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'amusnetexe'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATA_DIR = '/data'
  PORT = '8787'

[[mounts]]
  source = 'wobble_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
