# Fly.io deploy for Wobble Rush 3D (#47). One Machine in Frankfurt (closest to Sofia).
app = "wobble-rush-3d"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  DATA_DIR = "/data"

[[mounts]]
  source = "wobble_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
